[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cora"
version = "0.0.5"
description = "Cora P0.5 - a grounded, citation-gated hypothesis-card tool for the comparative biology of aging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.50",
  "pydantic>=2.0",
  "rank-bm25>=0.2",
  "fastapi>=0.100",
  "uvicorn>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
cora = "cora.cli:main"

[tool.setuptools.packages.find]
include = ["cora*"]

[tool.setuptools.package-data]
cora = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
